name = "balebot"
main = "src/worker/index.js"
compatibility_date = "2024-01-01"

[env.production]
name = "balebot-prod"
routes = [
  { pattern = "api.balebot.io/*", zone_name = "balebot.io" }
]

[[kv_namespaces]]
binding = "OTP_STORE"
id = "your-kv-namespace-id"
preview_id = "your-preview-kv-namespace-id"

[[kv_namespaces]]
binding = "SESSION_STORE"
id = "your-session-kv-namespace-id"
preview_id = "your-session-preview-kv-namespace-id"

[env.production.kv_namespaces]
- binding = "OTP_STORE"
  id = "your-prod-kv-namespace-id"
  preview_id = "your-prod-preview-kv-namespace-id"

[env.production.kv_namespaces]
- binding = "SESSION_STORE"
  id = "your-prod-session-kv-namespace-id"
  preview_id = "your-prod-session-preview-kv-namespace-id"

[build]
command = "npm run build:worker"
